<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>年終餐會報名後台</title>
<style>
  :root{ --bg:#f6f3ee; --card:#fff; --ink:#2b2b2b; --sub:#7a7268; --line:#e3ddd3;
         --accent:#b4432f; --ok:#2f7d4f; --warn:#b07c20; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);padding:24px 16px 80px;
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:980px;margin:0 auto}
  h1{font-size:21px;margin:0 0 16px}
  h2{font-size:16px;margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  input{padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:16px;font-family:inherit}
  button{padding:11px 18px;border:0;border-radius:9px;background:var(--accent);color:#fff;
         font-weight:700;cursor:pointer;font-size:15px;font-family:inherit}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .stat{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .stat b{display:block;font-size:24px;line-height:1.2}
  .stat span{font-size:13px;color:var(--sub)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--sub);font-size:12px;font-weight:600;white-space:nowrap}
  .del{color:var(--accent);cursor:pointer;background:none;border:0;padding:0;font-size:13px}
  .scroll{overflow-x:auto}
  .err{color:var(--accent);font-size:14px;margin-top:8px}
  .tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;white-space:nowrap}
  .t-first{background:#e7f2ea;color:var(--ok)}
  .t-moved{background:#fbf1de;color:var(--warn)}
  .t-wait{background:#fdecea;color:var(--accent)}
  .note{font-size:13px;color:var(--sub)}
  .over{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>年終餐會報名後台</h1>

  <div class="card" id="gate">
    <div class="row">
      <input type="password" id="key" placeholder="後台密碼" style="flex:1;min-width:180px">
      <button id="go">登入</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div id="panel" hidden>
    <div class="stats" id="stats"></div>

    <div class="card">
      <h2>抽籤</h2>
      <p class="note" id="drawState"></p>
      <div class="row">
        <input type="number" id="seed" placeholder="亂數種子（留空自動產生）" style="width:230px">
        <button id="draw">執行抽籤（預覽）</button>
        <button class="ghost" id="save" disabled>確認並公布結果</button>
        <button class="ghost" id="reset">清除抽籤結果</button>
      </div>
      <p class="note" style="margin:12px 0 0">
        做法：以種子打亂所有組別順序 → 依打亂順序分配第一志願，座位放不下的組先跳過 →
        未分到的組依序遞補到另一間（勾選「只想要自己選的那間」的組不遞補，位子直接讓給別人） →
        最後用剩餘座位撿還塞得下、且願意去那間的組，把位子補滿 →
        仍排不進的列未中選。與填寫時間完全無關；記下種子即可重現同一結果。
      </p>
      <div id="preview"></div>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:14px">
        <button class="ghost" id="reload">重新整理</button>
        <button class="ghost" id="csv">下載 CSV</button>
        <button class="ghost" id="names">複製公布名單</button>
      </div>
      <div class="scroll"><table>
        <thead><tr><th>#</th><th>登記餐廳</th><th>抽籤結果</th><th>意願</th><th>填表人</th><th>人數</th>
                   <th>同組全員</th><th>填寫時間</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── 改成你賓果那個 Supabase 專案的設定 ─────────────────
const SUPABASE_URL = "https://opvnnnmrbqwduratnbbq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wdm5ubm1yYnF3ZHVyYXRuYmJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNDUxMTMsImV4cCI6MjEwNjgyMTExM30.TtFN7axB3mWx0GmJwvrKfQijqsUpUeJpHC_VfHA9QF8";
// ──────────────────────────────────────────────────

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const fmt = t => new Date(t).toLocaleString("zh-TW", { hour12:false });
const all = r => [r.leader_name, ...(r.members || [])];

let key = "", rows = [], caps = [], result = null;

// ── 抽籤演算法 ──────────────────────────────────────
function rng(seed){ // mulberry32，給定種子結果可重現
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

function runDraw(seed){
  const rand = rng(seed);
  const pool = rows.map(r => ({ id:r.id, size:r.group_size, pref:r.restaurant,
                                only:!!r.only_first, leader:r.leader_name,
                                names:all(r), assigned:null }));
  // Fisher–Yates，順序與填寫時間無關
  for (let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  const left = {}; caps.forEach(c => left[c.restaurant] = c.capacity);

  // 1) 第一志願：放得下就進，放不下跳過（讓後面小組把位子填滿）
  for (const g of pool)
    if (g.size <= left[g.pref]){ g.assigned = g.pref; left[g.pref] -= g.size; }

  // 2) 落選組遞補到另一間（勾「只想要自己選的那間」的組不遞補，位子留給別人）
  const others = r => caps.map(c => c.restaurant).filter(x => x !== r);
  for (const g of pool){
    if (g.assigned || g.only) continue;
    for (const o of others(g.pref))
      if (g.size <= left[o]){ g.assigned = o; left[o] -= g.size; break; }
  }

  // 3) 補滿零頭：剩餘座位由大到小撿還塞得下、且願意去那間的組
  const ok = (g, rest) => g.pref === rest || !g.only;
  let moved = true;
  while (moved){
    moved = false;
    for (const rest of caps.map(c => c.restaurant)){
      if (left[rest] <= 0) continue;
      const fit = pool.filter(g => !g.assigned && g.size <= left[rest] && ok(g, rest))
                      .sort((a, b) => b.size - a.size)[0];
      if (fit){ fit.assigned = rest; left[rest] -= fit.size; moved = true; }
    }
  }

  pool.forEach(g => g.status = !g.assigned ? "wait" : (g.assigned === g.pref ? "first" : "moved"));
  return { seed, pool, left };
}

function preview(res){
  const byRest = {};
  caps.forEach(c => byRest[c.restaurant] = res.pool.filter(g => g.assigned === c.restaurant));
  const wait = res.pool.filter(g => !g.assigned);
  const moved = res.pool.filter(g => g.status === "moved");

  $("preview").innerHTML = `
    <div class="stats" style="margin:16px 0 0">
      ${caps.map(c => { const g = byRest[c.restaurant];
        const n = g.reduce((s, x) => s + x.size, 0);
        return `<div class="stat"><b>${n} / ${c.capacity}</b>
          <span>${c.restaurant}　${g.length} 組　${c.capacity - n ? `空 ${c.capacity - n} 位` : "剛好坐滿"}</span></div>`;
      }).join("")}
      <div class="stat"><b>${moved.length}</b><span>改分到另一間的組</span></div>
      <div class="stat"><b>${wait.length}</b><span>未中選組（${wait.reduce((s,x)=>s+x.size,0)} 人）
        ${wait.filter(g=>g.only).length ? `，其中 ${wait.filter(g=>g.only).length} 組只想要原選餐廳` : ""}</span></div>
    </div>
    <p class="note" style="margin-top:12px">種子 <b>${res.seed}</b>　—　這只是預覽，按「確認並公布結果」才會寫入資料庫。</p>`;
}

// ── 載入與顯示 ──────────────────────────────────────
async function load(){
  const { data, error } = await db.rpc("dinner_list", { p_key: key });
  if (error){ $("err").textContent = "密碼錯誤或連線失敗。"; return false; }
  rows = data;
  caps = (await db.rpc("dinner_remaining")).data || [];

  const people = rows.reduce((s, r) => s + r.group_size, 0);
  $("stats").innerHTML = caps.map(c => {
    const over = c.taken > c.capacity;
    return `<div class="stat"><b class="${over?"over":""}">${c.taken} / ${c.capacity}</b>
      <span>${c.restaurant}　${over ? `超出 ${c.taken - c.capacity} 位，需抽籤` : `空 ${c.capacity - c.taken} 位`}</span></div>`;
  }).join("") +
  `<div class="stat"><b>${rows.length}</b><span>報名組數　共 ${people} 人</span></div>`;

  const drawn = rows.filter(r => r.assigned).length;
  $("drawState").textContent = drawn
    ? `已完成抽籤（種子 ${rows.find(r => r.draw_seed)?.draw_seed ?? "—"}，${fmt(rows.find(r => r.drawn_at).drawn_at)}），下表「抽籤結果」為最終分配。`
    : "尚未抽籤。報名截止後再執行，中途執行的結果會被之後的新報名打亂。";

  const tag = r => !r.assigned ? "" :
    r.status === "first" ? `<span class="tag t-first">如願</span>` :
    r.status === "moved" ? `<span class="tag t-moved">改分</span>` :
                           `<span class="tag t-wait">未中選</span>`;

  $("rows").innerHTML = rows.map((r, i) =>
    `<tr><td>${i+1}</td><td>${r.restaurant}</td>
     <td>${r.assigned || (r.status === "wait" ? "未中選" : "—")} ${tag(r)}</td>
     <td>${r.only_first ? "只要原選" : "都可以"}</td>
     <td>${r.leader_name}</td><td>${r.group_size}</td>
     <td>${all(r).join("、")}</td><td>${fmt(r.created_at)}</td>
     <td><button class="del" data-id="${r.id}">刪除</button></td></tr>`
  ).join("") || `<tr><td colspan="9" class="note">目前沒有報名資料</td></tr>`;

  $("rows").querySelectorAll(".del").forEach(b => b.onclick = async () => {
    if (!confirm("確定刪除這筆報名？")) return;
    await db.rpc("dinner_delete", { p_key: key, p_id: +b.dataset.id });
    load();
  });
  return true;
}

// ── 事件 ────────────────────────────────────────────
$("go").onclick = async () => {
  key = $("key").value; $("err").textContent = "";
  if (await load()){ $("gate").hidden = true; $("panel").hidden = false; }
};
$("key").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
$("reload").onclick = load;

$("draw").onclick = () => {
  if (!rows.length) return alert("還沒有報名資料。");
  const seed = +$("seed").value || Math.floor(Math.random() * 1e9);
  $("seed").value = seed;
  result = runDraw(seed);
  preview(result);
  $("save").disabled = false;
};

$("save").onclick = async () => {
  if (!result) return;
  if (!confirm("確認寫入抽籤結果？會覆蓋先前的結果。")) return;
  const payload = result.pool.map(g => ({ id: g.id, assigned: g.assigned, status: g.status }));
  const { error } = await db.rpc("dinner_apply_draw",
    { p_key: key, p_seed: result.seed, p_rows: payload });
  if (error) return alert("寫入失敗：" + error.message);
  $("save").disabled = true; $("preview").innerHTML = "";
  await load(); alert("抽籤結果已寫入。");
};

$("reset").onclick = async () => {
  if (!confirm("清除所有抽籤結果？")) return;
  await db.rpc("dinner_reset_draw", { p_key: key });
  result = null; $("save").disabled = true; $("preview").innerHTML = "";
  load();
};

$("csv").onclick = () => {
  const esc = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const label = { first:"如願", moved:"改分", wait:"未中選" };
  const body = rows.map(r => [r.restaurant, r.assigned || "", label[r.status] || "",
                              r.only_first ? "只要原選" : "都可以",
                              r.leader_name, r.group_size, all(r).join("、"),
                              fmt(r.created_at)].map(esc).join(","));
  const csv = "\uFEFF" + ["登記餐廳,抽籤結果,狀態,意願,填表人,人數,同組全員,填寫時間", ...body].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" }));
  a.download = "年終餐會名單.csv"; a.click();
};

$("names").onclick = () => {
  const drawn = rows.some(r => r.assigned);
  const byRest = {}, wait = [];
  rows.forEach(r => {
    const where = drawn ? r.assigned : r.restaurant;
    if (!where) wait.push(...all(r)); else (byRest[where] ||= []).push(...all(r));
  });
  let text = Object.entries(byRest)
    .map(([k, v]) => `【${k}】共 ${v.length} 人\n${v.join("、")}`).join("\n\n");
  if (wait.length) text += `\n\n【未中選】共 ${wait.length} 人\n${wait.join("、")}`;
  if (!drawn) text = "（尚未抽籤，以下為登記志願）\n\n" + text;
  navigator.clipboard.writeText(text).then(() => alert("名單已複製，可直接貼到公告。"));
};
</script>
</body>
</html>
