<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>年終餐會餐廳調查</title>
<style>
  :root{ --bg:#f6f3ee; --card:#fff; --ink:#2b2b2b; --sub:#7a7268; --line:#e3ddd3;
         --accent:#b4432f; --accent-soft:#fbeeea; --ok:#2f7d4f; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
       line-height:1.6;padding:24px 16px 60px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--sub);font-size:14px;margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  label{display:block;font-weight:600;font-size:15px;margin:0 0 6px}
  .hint{font-weight:400;color:var(--sub);font-size:13px}
  input[type=text],select{width:100%;padding:11px 12px;border:1px solid var(--line);
       border-radius:9px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
  input[type=text]:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .field{margin-bottom:18px}
  .field:last-child{margin-bottom:0}
  #members input{margin-bottom:8px}
  .rest{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);
        border-radius:11px;padding:13px 14px;margin-bottom:10px;cursor:pointer;background:#fff}
  .rest.sel{border-color:var(--accent);background:var(--accent-soft)}
  .rest.off{opacity:.45;cursor:not-allowed}
  .rest input{margin-top:5px;accent-color:var(--accent);flex:none}
  .rest b{font-size:16px}
  .seat{font-size:13px;color:var(--sub);display:block;margin-top:2px}
  .seat.full{color:var(--accent);font-weight:600}
  button{width:100%;padding:14px;border:0;border-radius:11px;background:var(--accent);
         color:#fff;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
  button:disabled{background:#c3bcb3;cursor:not-allowed}
  .msg{padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:15px;display:none}
  .msg.err{display:block;background:#fdecea;color:#a3271a}
  .done{text-align:center;padding:36px 20px}
  .done .tick{font-size:42px;color:var(--ok)}
  .done h2{margin:10px 0 6px;font-size:20px}
  .done p{color:var(--sub);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>年終餐會餐廳調查</h1>
  <p class="sub">一組最多 4 人，請由其中一位代表填寫整組。姓名請填<b>本名</b>，用以查核是否重複登記。
  超過座位數的餐廳仍可選填，之後會以「組」為單位公開抽籤分配。</p>

  <div id="msg" class="msg"></div>

  <form id="form" class="card">
    <div class="field">
      <label for="leader">您的姓名 <span class="hint">（本名）</span></label>
      <input type="text" id="leader" autocomplete="name" required>
    </div>

    <div class="field">
      <label for="size">同組人數 <span class="hint">（含自己，最多 4 人）</span></label>
      <select id="size">
        <option value="1">1 人（自己）</option>
        <option value="2">2 人</option>
        <option value="3">3 人</option>
        <option value="4">4 人</option>
      </select>
    </div>

    <div class="field" id="memberBox" hidden>
      <label>同組所有人本名 <span class="hint">（第 1 位為填表人，自動帶入；全部都要填）</span></label>
      <div id="members"></div>
    </div>

    <div class="field">
      <label>餐廳選擇</label>
      <div id="rests">載入名額中…</div>
    </div>

    <div class="field">
      <label>抽籤結果意願 <span class="hint">（此選項不影響抽籤順序，僅供統計）</span></label>
      <label class="rest" id="w0"><input type="radio" name="will" value="0" checked>
        <span><b>不管是哪一間都會參加</b>
        <span class="seat">抽到另一間也照常出席</span></span></label>
      <label class="rest" id="w1"><input type="radio" name="will" value="1">
        <span><b>只想要自己選的那一間</b>
        <span class="seat">若抽到另一間，就不參加年終餐會</span></span></label>
    </div>

    <button type="submit" id="submit">送出報名</button>
  </form>

  <div class="card done" id="done" hidden>
    <div class="tick">✓</div>
    <h2>報名完成</h2>
    <p id="doneText"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ── 改成你賓果那個 Supabase 專案的設定 ─────────────────
const SUPABASE_URL = "https://opvnnnmrbqwduratnbbq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wdm5ubm1yYnF3ZHVyYXRuYmJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNDUxMTMsImV4cCI6MjEwNjgyMTExM30.TtFN7axB3mWx0GmJwvrKfQijqsUpUeJpHC_VfHA9QF8";
// ──────────────────────────────────────────────────

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let seats = [], picked = null;

function showErr(t){ const m=$("msg"); m.textContent=t; m.className="msg err"; window.scrollTo({top:0,behavior:"smooth"}); }
function clearErr(){ $("msg").className="msg"; }

$("size").addEventListener("change", () => { renderMembers(); renderRests(); });
$("leader").addEventListener("input", () => {
  const self = $("members").querySelector('input[data-self]');
  if (self) self.value = $("leader").value.trim();
});

function renderMembers(){
  const n = +$("size").value;
  $("memberBox").hidden = n < 2;
  const box = $("members");
  const old = [...box.querySelectorAll("input:not([data-self])")].map(i => i.value);
  box.innerHTML = "";
  if (n < 2) return;

  const me = document.createElement("input");
  me.type = "text"; me.dataset.self = "1"; me.readOnly = true;
  me.value = $("leader").value.trim();
  me.placeholder = "1. 填表人（上方姓名）";
  me.style.background = "#f2efe9"; me.style.color = "#7a7268";
  box.appendChild(me);

  for (let i = 1; i < n; i++){
    const inp = document.createElement("input");
    inp.type = "text"; inp.placeholder = `${i+1}. 組員姓名`; inp.value = old[i-1] || "";
    box.appendChild(inp);
  }
}

async function loadSeats(){
  const { data, error } = await db.rpc("dinner_remaining");
  if (error){ if (!seats.length) $("rests").textContent = "名額載入失敗，請重新整理。"; return; }
  seats = data; renderRests();
}

// 每 5 秒更新剩餘名額；切到別的分頁時暫停，回來立刻更新
setInterval(() => { if (!document.hidden && !$("form").hidden) loadSeats(); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadSeats(); });

function renderRests(){
  $("rests").innerHTML = "";
  seats.forEach(r => {
    const over = r.taken > r.capacity;
    const el = document.createElement("label");
    el.className = "rest" + (picked === r.restaurant ? " sel" : "");
    el.innerHTML = `<input type="radio" name="rest" ${picked===r.restaurant?"checked":""}>
      <span><b>${r.restaurant}</b><span class="seat ${over?"full":""}">
        座位 ${r.capacity} 位，目前已登記 ${r.taken} 位
        ${over ? `（超出 ${r.taken - r.capacity} 位，將以「組」為單位抽籤）`
               : `（還有 ${r.capacity - r.taken} 位）`}
      </span></span>`;
    el.onclick = () => { picked = r.restaurant; renderRests(); };
    $("rests").appendChild(el);
  });
  const tip = document.createElement("div");
  tip.className = "seat";
  tip.textContent = "名額每 5 秒自動更新（" +
    new Date().toLocaleTimeString("zh-TW", { hour12:false }) + "）";
  $("rests").appendChild(tip);
}

$("form").addEventListener("submit", async e => {
  e.preventDefault(); clearErr();
  const leader = $("leader").value.trim();
  const size = +$("size").value;
  const members = [...$("members").querySelectorAll("input:not([data-self])")].map(i => i.value.trim());

  if (!leader) return showErr("請填寫您的姓名。");
  if (members.some(m => !m)) return showErr("請填寫同組所有人的本名。");
  const all = [leader, ...members];
  if (new Set(all).size !== all.length) return showErr("同組內有重複的姓名。");
  if (!picked) return showErr("請選擇餐廳。");

  $("submit").disabled = true; $("submit").textContent = "送出中…";
  const onlyFirst = document.querySelector('input[name="will"]:checked').value === "1";
  const { data, error } = await db.rpc("dinner_submit", {
    p_leader: leader, p_size: size, p_members: members,
    p_restaurant: picked, p_only_first: onlyFirst
  });
  $("submit").disabled = false; $("submit").textContent = "送出報名";

  if (error) return showErr("連線失敗，請再試一次。");
  if (!data.ok){ await loadSeats(); return showErr(data.error); }

  $("form").hidden = true;
  $("done").hidden = false;
  $("doneText").textContent =
    `${picked}，共 ${size} 位：${all.join("、")}。若該餐廳超額，將以整組為單位抽籤，結果另行公布。`;
});

// 意願選項的選取樣式
function syncWill(){
  ["w0", "w1"].forEach(id =>
    $(id).classList.toggle("sel", $(id).querySelector("input").checked));
}
document.querySelectorAll('input[name="will"]').forEach(i => i.addEventListener("change", syncWill));
syncWill();

renderMembers();
loadSeats();
</script>
</body>
</html>
